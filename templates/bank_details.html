{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h3>Bank Details · {{bank.name}}</h3><a href="{{url_for('banks')}}" class="btn btn-outline-secondary">Back</a></div><div class="card p-3"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="row g-3"><div class="col-md-6"><label class="form-label">PayID</label><input class="form-control" name="payid" value="{{ detail.payid if detail and detail.payid else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">BSB Number</label><input class="form-control" name="bsb_number" value="{{ detail.bsb_number if detail and detail.bsb_number else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">Account Number</label><input class="form-control" name="account_number" value="{{ detail.account_number if detail and detail.account_number else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">Phone Number</label><input class="form-control" name="phone_number" value="{{ detail.phone_number if detail and detail.phone_number else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">Date of Birth (optional)</label><input class="form-control" name="date_of_birth" value="{{ detail.date_of_birth if detail and detail.date_of_birth else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">Card Last 4 Digits (optional)</label><input class="form-control" name="card_details" inputmode="numeric" pattern="[0-9]{4}" value="{{ detail.card_details[-4:] if detail and detail.card_details else '' }}" maxlength="4"></div><div class="col-md-6"><label class="form-label">Expiry Date (optional)</label><input class="form-control" name="expiry_date" value="{{ detail.expiry_date if detail and detail.expiry_date else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">Login ID</label><input class="form-control" name="login_id" value="{{ detail.login_id if detail and detail.login_id else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">OTP API Link (optional)</label><input class="form-control" name="otp_api_link" value="{{ detail.otp_api_link if detail and detail.otp_api_link else '' }}" maxlength="180"></div><div class="col-md-6"><label class="form-label">Remark</label><input class="form-control" name="remark" value="{{ detail.remark if detail and detail.remark else '' }}" maxlength="180"></div>{% if can('edit_bank_details') %}<div class="col-md-6"><label class="form-label">New Login Password (leave blank to keep existing)</label><input type="password" name="login_password" class="form-control" autocomplete="new-password"></div><div class="col-12"><button class="btn btn-primary">Save Bank Details</button></div>{% else %}<fieldset disabled></fieldset>{% endif %}</div></form></div>{% if can_sensitive %}<form method="post" action="{{url_for('reveal_bank_password',bank_id=bank.id)}}" class="mt-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-outline-warning">Reveal Login Password (audited)</button></form>{% endif %}<p class="text-muted small mt-3">CVV and Card PIN are not stored. All actions are scoped to the selected platform.</p>{% endblock %}
