{% extends 'base.html' %}{% block content %}<h3>Credential Access · {{bank.name}}</h3><div class="alert alert-warning">This access has been logged. Do not share or screenshot credentials.</div><div class="card p-3"><label>Login Password</label><input class="form-control" readonly type="password" id="pw" value="{{password or ''}}"><button class="btn btn-outline-secondary mt-2" type="button" onclick="let e=document.getElementById('pw');e.type=e.type==='password'?'text':'password'">Show / Hide</button></div><a class="btn btn-link" href="{{url_for('bank_details',bank_id=bank.id)}}">Back</a>{% endblock %}
