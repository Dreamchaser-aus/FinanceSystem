{% extends 'base.html' %}
{% block content %}
<section class="card mx-auto mt-4 p-4" style="max-width:440px">
  <h1 class="h4">Change password</h1>
  <p>Account: <strong>{{ current_user.username }}</strong></p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="current_password">Current password</label>
    <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label class="form-label mt-3" for="new_password">New password (6 or more characters)</label>
    <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="6" required>
    <label class="form-label mt-3" for="confirm_password">Confirm new password</label>
    <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <button class="btn btn-primary w-100 mt-4">Save and sign in again</button>
  </form>
</section>
{% endblock %}
