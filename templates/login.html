{% extends 'base.html' %}
{% block content %}
<style>
body.bf-anon{min-height:100vh;color:#e8f0ff;background:radial-gradient(900px 520px at 50% 22%,#0b2c6b55 0,#0000 70%),linear-gradient(180deg,#01031a,#020a2b 60%,#01041f);background-attachment:fixed}
.bf-anon .bf-topbar{display:none}
.bf-anon .bf-main{padding-top:0!important}
.bf-anon .bf-content-inner{max-width:420px}
.bf-login{min-height:calc(100vh - 3rem);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.5rem 0}
.bf-login-logo{display:block;width:min(360px,86vw);height:auto;margin:0 auto -6px;-webkit-mask-image:radial-gradient(closest-side,#000 62%,#0000 100%);mask-image:radial-gradient(closest-side,#000 62%,#0000 100%);mix-blend-mode:screen;user-select:none;pointer-events:none}
.bf-login-card{width:100%;padding:1.6rem 1.6rem 1.5rem;border-radius:20px;background:linear-gradient(180deg,#ffffff14,#ffffff0a);border:1px solid #ffffff24;box-shadow:0 24px 70px #00000066,inset 0 1px 0 #ffffff1f;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bf-login-card h1{font-size:1.35rem;font-weight:780;letter-spacing:-.02em;margin:0 0 .2rem;color:#fff}
.bf-login-sub{color:#9fb4d6;font-size:.88rem;margin-bottom:1.1rem}
.bf-login-card .form-label{color:#c5d4ee;font-size:.82rem;font-weight:650;margin:.85rem 0 .35rem}
.bf-login-card .form-control{background:#0a1a3f;border:1px solid #274680;color:#fff;border-radius:11px;padding:.72rem .9rem;min-height:46px}
.bf-login-card .form-control::placeholder{color:#6f86ad}
.bf-login-card .form-control:hover{border-color:#3a63ad}
.bf-login-card .form-control:focus{background:#0c2150;border-color:#5b9dff;box-shadow:0 0 0 .22rem #3b82f633;color:#fff}
.bf-login-card input:-webkit-autofill{-webkit-text-fill-color:#fff;box-shadow:0 0 0 1000px #0a1a3f inset;caret-color:#fff}
.bf-pw{position:relative}.bf-pw .form-control{padding-right:3.2rem}
.bf-pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:34px;padding:0 .65rem;border:0;border-radius:8px;background:transparent;color:#8fb0e8;font-size:.78rem;font-weight:700;cursor:pointer}
.bf-pw-toggle:hover{color:#fff;background:#ffffff14}
.bf-login-card .btn-login{width:100%;margin-top:1.4rem;min-height:48px;border:0;border-radius:12px;font-weight:700;font-size:1rem;color:#fff;background:linear-gradient(180deg,#3d8bff,#1f63e6);box-shadow:0 8px 24px #1f63e655,inset 0 1px 0 #ffffff33;transition:filter .15s,transform .05s}
.bf-login-card .btn-login:hover{filter:brightness(1.08)}.bf-login-card .btn-login:active{transform:translateY(1px)}
.bf-login-card .btn-login:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bf-anon .alert{border-radius:12px;margin:.9rem auto 0;max-width:420px;margin-inline:auto}
.bf-login-foot{margin-top:1.1rem;color:#6f86ad;font-size:.75rem;text-align:center}
@media(max-width:575.98px){.bf-login{justify-content:flex-start;padding-top:1.2rem}.bf-login-card{padding:1.3rem 1.15rem}}
</style>
