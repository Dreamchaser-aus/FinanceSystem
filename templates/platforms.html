{% extends 'base.html' %}{% block content %}<h3>Platforms</h3><div class="card p-3 mb-3"><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-md-8"><label class="form-label">New Platform Name</label><input name="name" class="form-control" maxlength="120" required></div><div class="col-md-4 align-self-end"><button class="btn btn-primary w-100">Add Platform</button></div></form></div><div class="card p-3"><table class="table"><thead><tr><th>Platform</th><th>Status</th></tr></thead><tbody>{% for p in platforms %}<tr><td>{{p.name}}</td><td>{{'Active' if p.active else 'Inactive'}}</td></tr>{% endfor %}</tbody></table></div><p class="small text-muted mt-3">Existing records are assigned to Legacy Platform by the migration. Review before allocating new accounts.</p>{% endblock %}
