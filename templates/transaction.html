{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div><h3 class="mb-1">New Transaction</h3><div class="text-muted">One form for customer, bank and dealer transactions</div></div>
  <a class="btn btn-outline-secondary" href="{{ url_for('transactions') }}">Transaction History</a>
</div>
<div class="card p-3 p-lg-4" style="max-width:820px">
  <form method="post" id="newTransactionForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-12"><label class="form-label fw-semibold" for="kind">Transaction Type</label>
        <select class="form-select" id="kind" name="kind" required>
          <option value="deposit">Customer Deposit — Bank Received</option>
          <option value="withdrawal">Customer Withdrawal — Bank Paid</option>
          <option value="dealer_payout">Customer Withdrawal — Dealer Paid</option>
          <option value="dealer_sell">Sell AUD — Bank to Dealer</option>
          <option value="dealer_buy">Buy AUD — Dealer to Bank</option>
          <option value="transfer">Bank to Bank Transfer</option>
        </select>
      </div>
      <div class="col-12 col-md-6"><label class="form-label fw-semibold" for="reference">Transaction ID / Reference</label><input class="form-control" id="reference" name="reference" maxlength="120" required placeholder="Unique reference"></div>
      <div class="col-12 col-md-6"><label class="form-label fw-semibold" for="amount">Amount (AUD)</label><input class="form-control" type="number" inputmode="decimal" id="amount" name="amount" min="0.01" step="0.01" required></div>
      <div class="col-12 col-md-6" id="bankBlock"><label class="form-label fw-semibold" id="bankLabel" for="bank_id">Receiving Bank</label><select class="form-select" id="bank_id" name="bank_id"><option value="">Select bank</option>{% for bank in banks %}<option value="{{ bank.id }}">{{ bank.name }}</option>{% endfor %}</select></div>
      <div class="col-12 col-md-6 d-none" id="toBankBlock"><label class="form-label fw-semibold" for="to_bank_id">Destination Bank</label><select class="form-select" id="to_bank_id" name="to_bank_id"><option value="">Select destination</option>{% for bank in banks %}<option value="{{ bank.id }}">{{ bank.name }}</option>{% endfor %}</select></div>
      <div class="col-12 col-md-6 d-none" id="dealerBlock"><label class="form-label fw-semibold" for="dealer_id">Exchange Dealer</label><select class="form-select" id="dealer_id" name="dealer_id"><option value="">Select dealer</option>{% for dealer in dealers %}<option value="{{ dealer.id }}">{{ dealer.name }}</option>{% endfor %}</select></div>
      <div class="col-12 col-md-6 d-none" id="rateBlock"><label class="form-label fw-semibold" for="rate">Exchange Rate (MYR / AUD)</label><input class="form-control" type="number" inputmode="decimal" id="rate" name="rate" min="0.000001" max="1000" step="0.000001" placeholder="2.790000"></div>
      <div class="col-12 col-md-6" id="customerBlock"><label class="form-label fw-semibold" for="customer_ref">Customer ID</label><input class="form-control" id="customer_ref" name="customer_ref" maxlength="120"></div>
      <div class="col-12"><label class="form-label fw-semibold" for="remark">Remark (optional)</label><textarea class="form-control" id="remark" name="remark" rows="2" maxlength="2000"></textarea></div>
    </div>
    <div class="alert alert-light border mt-3 mb-3" id="impact" aria-live="polite"></div>
    <button class="btn btn-primary" type="submit" id="submitBtn">Confirm Transaction</button>
    <p class="text-muted small mt-2 mb-0">Submit only after payment is confirmed. Dealer-paid customer withdrawals do not change bank balances.</p>
  </form>
</div>
<script>
(function () {
  const get = id => document.getElementById(id);
  const kind=get('kind'), amount=get('amount'), rate=get('rate'), bank=get('bank_id'), toBank=get('to_bank_id'), dealer=get('dealer_id'), customer=get('customer_ref');
  const dealerKinds=['dealer_sell','dealer_buy','dealer_payout'];
  const money = n => Number.isFinite(n) ? n.toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}) : '0.00';
  function refresh() {
    const k=kind.value, isDealer=dealerKinds.includes(k), direct=k==='dealer_payout', transfer=k==='transfer';
    get('bankBlock').classList.toggle('d-none',direct);
    get('toBankBlock').classList.toggle('d-none',!transfer);
    get('dealerBlock').classList.toggle('d-none',!isDealer);
    get('rateBlock').classList.toggle('d-none',!isDealer);
    get('customerBlock').classList.toggle('d-none',!['deposit','withdrawal','dealer_payout'].includes(k));
    get('bankLabel').textContent=['deposit','dealer_buy'].includes(k)?'Receiving Bank':'Source Bank';
    bank.required=!direct; toBank.required=transfer; dealer.required=isDealer; rate.required=isDealer; customer.required=direct;
    if(direct) bank.value='';
    if(!transfer) toBank.value='';
    const aud=Number(amount.value)||0, fx=Number(rate.value)||0;
    let bankImpact='No bank movement';
    if(k==='deposit'||k==='dealer_buy') bankImpact='Bank +AUD '+money(aud);
    else if(k==='withdrawal'||k==='dealer_sell') bankImpact='Bank −AUD '+money(aud);
    else if(transfer) bankImpact='Source −AUD '+money(aud)+'; destination +AUD '+money(aud);
    let msg='<strong>Impact Preview</strong><div>'+bankImpact+'</div>';
    if(isDealer) msg+='<div>Dealer '+(k==='dealer_sell'?'MYR receivable':'MYR payable')+': RM '+money(aud*fx)+'</div>';
    if(direct) msg+='<div>Customer Withdrawal: AUD '+money(aud)+' (Dealer paid)</div>';
    get('impact').innerHTML=msg;
  }
  [kind,amount,rate].forEach(el=>el.addEventListener('input',refresh));
  get('newTransactionForm').addEventListener('submit',function(e){
    if(kind.value==='transfer'&&bank.value===toBank.value){e.preventDefault();alert('Choose two different bank accounts');return;}
    if(!confirm('Confirm that this transaction has been completed and should be posted?'))e.preventDefault();
  });
  refresh();
})();
</script>
{% endblock %}
