{% extends 'base.html' %}{% block content %}<h3>New Transaction</h3><div class="card p-4" style="max-width:760px"><form method="post" id="txn"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Type</label><select class="form-select" name="kind" id="kind"><option value="deposit">Deposit (+)</option><option value="withdrawal">Withdrawal (-)</option><option value="transfer">Internal Transfer (- / +)</option></select></div><div class="col-md-6"><label class="form-label">Amount (RM)</label><input class="form-control" type="number" step="0.01" min="0.01" name="amount" required></div><div class="col-md-6"><label class="form-label">From / Account</label><select class="form-select" name="bank_id" required>{% for b in banks %}<option value="{{b.id}}">{{b.name}} ({{b.kind}})</option>{% endfor %}</select></div><div class="col-md-6" id="destination" hidden><label class="form-label">To Bank</label><select class="form-select" name="to_bank_id" id="to_bank"><option value="">Choose destination</option>{% for b in banks %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Transaction ID (unique)</label><input class="form-control" name="reference" required maxlength="120"></div><div class="col-md-6"><label class="form-label">Customer / User Reference</label><input class="form-control" name="customer_ref" maxlength="120"></div><div class="col-12"><label class="form-label">Remark</label><textarea class="form-control" name="remark" rows="2"></textarea></div></div><button class="btn btn-primary mt-4" id="submitBtn">Confirm Transaction</button><p class="text-muted small mt-3 mb-0">V1 records current Malaysia business day. Pending and external transfers are not supported by this form. Once confirmed, a transaction cannot be edited here.</p></form></div><script>const kind=document.getElementById('kind'),dest=document.getElementById('destination'),to=document.getElementById('to_bank');function update(){dest.hidden=kind.value!=='transfer';to.required=kind.value==='transfer';if(dest.hidden)to.value=''}kind.addEventListener('change',update);update();document.getElementById('txn').addEventListener('submit',()=>{document.getElementById('submitBtn').disabled=true})</script>{% endblock %}
