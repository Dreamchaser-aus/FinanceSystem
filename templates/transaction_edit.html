{% extends 'base.html' %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3>Edit Transaction</h3><a class="btn btn-outline-secondary" href="{{url_for('transactions')}}">Back</a></div>
<div class="alert alert-warning">Editing a transaction recalculates bank balances. Transactions on closed business dates or involving banks already closed for the day cannot be edited.</div>
<div class="card p-3"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="row g-3">
<div class="col-md-4"><label class="form-label">Type</label><select class="form-select" name="kind" id="kind" onchange="toggleTransfer()" required>{% for v in ['deposit','withdrawal','transfer'] %}<option value="{{v}}" {% if t.kind==v %}selected{% endif %}>{{v|title}}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Transaction ID</label><input class="form-control" name="reference" value="{{t.reference}}" maxlength="120" required></div>
<div class="col-md-4"><label class="form-label">Amount (AUD)</label><input class="form-control" type="number" step="0.01" min="0.01" name="amount" value="{{t.signed_amount|abs}}" required></div>
<div class="col-md-6"><label class="form-label">Bank Account (Deposit / Withdrawal / From)</label><select class="form-select" name="bank_id" required>{% for b in banks %}<option value="{{b.id}}" {% if b.id==source_id %}selected{% endif %}>{{b.name}} — {{b.status}}</option>{% endfor %}</select></div>
<div class="col-md-6" id="destination"><label class="form-label">To Bank (Transfer)</label><select class="form-select" name="to_bank_id"><option value="">Choose bank</option>{% for b in banks %}<option value="{{b.id}}" {% if b.id==destination_id %}selected{% endif %}>{{b.name}} — {{b.status}}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Customer Name</label><input class="form-control" name="customer_ref" value="{{t.customer_ref or ''}}" maxlength="120"></div>
<div class="col-12"><label class="form-label">Remark</label><textarea class="form-control" name="remark" maxlength="2000" rows="3">{{t.remark or ''}}</textarea></div>
<div class="col-12"><button class="btn btn-primary" onclick="return confirm('Save changes and recalculate balances?')">Save Changes</button></div></div></form></div>
<script>function toggleTransfer(){document.getElementById('destination').style.display=document.getElementById('kind').value==='transfer'?'':'none'}toggleTransfer();</script>
{% endblock %}
